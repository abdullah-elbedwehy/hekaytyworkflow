name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r tools/requirements.txt
      - name: Check patch whitespace
        run: git diff --check HEAD
      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
